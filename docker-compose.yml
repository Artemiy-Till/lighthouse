name: max-travel-marketplace

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_PASSWORD: marketplace
      POSTGRES_USER: marketplace
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U marketplace -d marketplace']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      CORS_ORIGINS: http://localhost:5173
      DATABASE_URL: postgresql://marketplace:marketplace@postgres:5432/marketplace?schema=public
      LOG_LEVEL: info
      MAX_API_BASE_URL: https://platform-api2.max.ru
      MAX_API_TIMEOUT_MS: 5000
      NODE_ENV: production
      PORT: 3000
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - '3000:3000'

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        VITE_API_BASE_URL: /
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '5173:80'

volumes:
  postgres-data:

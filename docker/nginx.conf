map "$request_method:$cookie_lighthouse_cache_refresh_20260930" $clear_legacy_app_cache {
  "GET:" '"cache"';
  default "";
}

map "$request_method:$cookie_lighthouse_cache_refresh_20260930" $legacy_cache_refresh_cookie {
  "GET:" "lighthouse_cache_refresh_20260930=1; Path=/; Max-Age=604800; Secure; SameSite=None";
  default "";
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    client_max_body_size 5m;
    # Older MAX WebViews may keep the pre-release HTML and script in their cache.
    # Clear that cache once on their first API read, without removing auth or storage.
    add_header Clear-Site-Data $clear_legacy_app_cache always;
    add_header Set-Cookie $legacy_cache_refresh_cookie always;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    add_header Cache-Control "no-store, max-age=0" always;
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
}
